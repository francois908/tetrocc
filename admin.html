<!doctype html><html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administration — Tétro.cc</title></head><body><header class="header wrap"><a class="brand" href="/"><span class="brand-name">tétro.cc</span><span class="brand-sub">ADMINISTRATION</span></a><a class="eyebrow" href="/">← Voir le site</a></header><main class="admin wrap"><span class="eyebrow">Espace organisateurs</span><h1>Les sorties.</h1><p class="muted">Créer, modifier et publier les rendez-vous du club.</p><div id="setup" class="notice hidden"></div><section id="login" class="login hidden"><h2>Connexion</h2><form id="login-form"><label class="field">Adresse courriel<input name="email" type="email" autocomplete="email" required></label><label class="field">Mot de passe<input name="password" type="password" autocomplete="current-password" required></label><button class="button">Se connecter →</button></form></section><section id="dashboard" class="hidden"><div class="actions"><button class="button" id="new">+ Nouvelle sortie</button><button class="button secondary" id="logout">Déconnexion</button></div><div class="admin-layout"><aside><h2>Sorties</h2><div id="admin-list" class="admin-list"></div></aside><section><h2 id="form-title">Nouvelle sortie</h2><form id="ride-form"><div class="form-grid"><label class="field">Titre<input name="title" required placeholder="Oka"></label><label class="field">Identifiant URL<input name="slug" required placeholder="oka-2027" pattern="[a-z0-9-]+"></label><label class="field">Date<input name="ride_date" type="date" required></label><label class="field">Heure de départ<input name="start_time" type="time"></label><label class="field">Lieu de rencontre<input name="meeting_point" list="meeting-points" placeholder="M Café | 9079 Rue Hochelaga"><datalist id="meeting-points"><option value="M Café | 9079 Rue Hochelaga"></option></datalist></label><label class="field">Distance (km)<input name="distance_km" type="number" min="0" step="0.1"></label><label class="field check wide"><span class="check-row"><input type="checkbox" name="two_groups"> 2 groupes de vitesse</span></label><label class="field"><span id="pace-label">Rythme</span><select name="pace"><option value="">À confirmer</option><option value="24–26 km/h">24–26 km/h</option><option value="26–28 km/h">26–28 km/h</option><option value="28–30 km/h">28–30 km/h</option><option value="30 km/h +">30 km/h +</option></select></label><label class="field hidden" id="pace2-field">Rythme — groupe 2<select name="pace_2"><option value="">À confirmer</option><option value="24–26 km/h">24–26 km/h</option><option value="26–28 km/h">26–28 km/h</option><option value="28–30 km/h">28–30 km/h</option><option value="30 km/h +">30 km/h +</option></select></label><label class="field wide">Lien Ride with GPS ou ID de parcours<input name="rwgps_route_id" placeholder="https://ridewithgps.com/routes/57071272"></label><label class="field">Statut<select name="status"><option value="draft">Brouillon</option><option value="published">Publiée</option><option value="cancelled">Annulée</option></select></label><label class="field">Image de couverture<select name="image_url"><option value="/assets/club-groupe.jpg">Photo du club</option><option value="/assets/archive-velo-v2.jpg">Archive vélo</option><option value="/assets/archive-duo-v2.jpg">Archive duo</option><option value="/assets/archive-enfant.jpg">Archive enfant</option><option value="/assets/club.jpg">Devant le café</option></select></label><label class="field wide">Description<textarea name="description"></textarea></label><label class="field wide">Ajouter une photo de couverture (facultatif)<input type="file" name="photo" accept="image/png,image/jpeg,image/webp"></label></div><div class="actions"><button class="button" type="submit">Enregistrer la sortie →</button><button class="button secondary danger hidden" type="button" id="delete">Supprimer</button></div></form><p id="feedback" class="message" role="status"></p></section></div><hr><h2>Photos du club</h2><p class="muted">Ajoute une photo à la galerie du club (affichée sous les sorties sur le site).</p><form id="photo-form" class="actions"><input type="file" name="photo" accept="image/png,image/jpeg,image/webp" required><input name="caption" placeholder="Légende (facultative)" aria-label="Légende"><button class="button">Ajouter une photo</button></form><div id="gallery" class="gallery"></div><h2>Infos du club</h2><form id="settings-form"><label class="field">Courriel de contact<input name="contact_email" type="email" placeholder="francois@latelierducontenu.com"></label><label class="field wide">Présentation du club<textarea name="about_text"></textarea></label><div class="actions"><button class="button">Enregistrer les infos</button></div></form></section></main><script type="module" src="/src/admin.js"></script></body></html>
